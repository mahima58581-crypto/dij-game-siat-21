<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1526" />
      <stop offset="50%" stop-color="#060d18" />
      <stop offset="100%" stop-color="#02060d" />
    </linearGradient>

    <!-- Emerald-to-Cyan Neon Cyber Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#39ff78" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <!-- Accent Laser Gradient -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#39ff78" stop-opacity="0" />
      <stop offset="50%" stop-color="#39ff78" stop-opacity="1" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield / Cyber Hexagon Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Inner Cyber Neon Border -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="none" stroke="url(#neonGrad)" stroke-width="2" opacity="0.9" filter="url(#neonGlow)" />

  <!-- Top Laser Beam Accent -->
  <line x1="14" y1="4" x2="50" y2="4" stroke="url(#laserGrad)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Cyber Reticle Corner Brackets -->
  <path d="M 10 16 L 10 10 L 16 10" fill="none" stroke="#39ff78" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 54 16 L 54 10 L 48 10" fill="none" stroke="#00f0ff" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 10 48 L 10 54 L 16 54" fill="none" stroke="#00f0ff" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 54 48 L 54 54 L 48 54" fill="none" stroke="#39ff78" stroke-width="1.8" stroke-linecap="round" />

  <!-- Central "DG" Gaming Monogram & Crest -->
  <g filter="url(#neonGlow)">
    <!-- Letter 'D' -->
    <path d="M 16 20 L 26 20 C 32 20, 35 24, 35 32 C 35 40, 32 44, 26 44 L 16 44 Z M 21 25 L 21 39 L 25 39 C 28.5 39, 30 36.5, 30 32 C 30 27.5, 28.5 25, 25 25 Z" fill="url(#neonGrad)" />

    <!-- Letter 'G' with Gaming Arrow / Cut -->
    <path d="M 47 24 L 42 21 C 36 21, 33 25, 33 32 C 33 39, 36 44, 43 44 C 47 44, 49 42, 50 39 L 50 33 L 42 33 L 42 29 L 54 29 L 54 41 C 51.5 45, 47.5 47, 42.5 47 C 34 47, 29 41, 29 32 C 29 23, 34 17, 43 17 C 46.5 17, 49.5 18.5, 52 21 Z" fill="url(#neonGrad)" />
  </g>

  <!-- Esports Pulsing Energy Core Spark -->
  <circle cx="43" cy="33" r="2" fill="#39ff78" />
  <circle cx="32" cy="11" r="1.5" fill="#00f0ff" />
</svg>
